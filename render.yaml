services:
  - type: web
    name: ai-workforce-os-u9vn
    env: docker
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: ENABLE_WEB_RESEARCH
        value: "true"
