services:
  - type: web
    name: ai-workforce-os-v04
    env: docker
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: ENABLE_WEB_RESEARCH
        value: "true"
      - key: DEFAULT_GOAL_BUDGET_USD
        value: "5"
      - key: MAX_GOAL_BUDGET_USD
        value: "25"
      - key: GLOBAL_DAILY_SPEND_CAP_USD
        value: "20"
      - key: MAX_REPLANS
        value: "2"
      - key: OPENAI_TIMEOUT_SECONDS
        value: "120"
      - key: APP_ACCESS_TOKEN
        sync: false
